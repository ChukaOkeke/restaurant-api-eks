name: CD - Asgard Zero-Trust Deployment

on:
  push:
    branches: [ main ]
    paths:
      - '.github/**'
      - 'src/**'
      - 'infrastructure/**'
      - 'tests/**'

env:
  AWS_REGION: "eu-west-1" # Adjust to match your AWS region
  ENVIRONMENT: "dev"      # Adjust based on your target workspace

# CRITICAL: These permissions are strictly required for OIDC federation to work
permissions:
  id-token: write # Required for OIDC
  contents: read  # Required for checkout

jobs:
  provision-and-deploy:
    name: Infrastructure Sync & Deploy
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      # STEP 1: OIDC Zero-Trust Authentication
      - name: Configure AWS Credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::${{ secrets.AWS_ACCOUNT_ID }}:role/asgard-${{ env.ENVIRONMENT }}-github-actions-role
          aws-region: ${{ env.AWS_REGION }}