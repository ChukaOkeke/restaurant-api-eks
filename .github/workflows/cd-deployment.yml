name: CD - Asgard Zero-Trust Deployment

# Decoupled App and Infra pipeline that triggers when a pull request is merged to the main branch, but only if changes are made to src/, charts/, infrastructure/, or both workflow files.

on:
  push:
    branches: [ main ]
    
# CONSTRAINT 1: Concurrency group prevents race conditions and Terraform state lock conflicts.
# cancel-in-progress is false to ensure active infrastructure deployments are not corrupted if multiple PRs are merged quickly.
concurrency:
  group: production-cd
  cancel-in-progress: false

env:
  AWS_REGION: "eu-west-1"
  ENVIRONMENT: "dev"      
  ECR_REPOSITORY: "restaurant-api-dev-app"
  GITOPS_REPO: "ChukaOkeke/restaurant-api-eks-gitops" 

# CRITICAL: These permissions are strictly required for OIDC federation to work.
permissions:
  id-token: write # Required for OIDC
  contents: read  # Required for checkout

jobs:
  # =========================================================================
  # JOB 0: THE TRAFFIC CONTROLLER (PATH FILTER INSPECTOR)
  # =========================================================================
  detect-changes:
    name: "Inspect Repository Changes"
    runs-on: ubuntu-latest
    outputs:
      src: ${{ steps.filter.outputs.src }}
      infra: ${{ steps.filter.outputs.infra }}
    steps:
        # Pull your code into the GitHub Runner
      - name: "Checkout Code Repository"
        uses: actions/checkout@v4

      - name: "Evaluate Changed File Paths"
        id: filter
        uses: dorny/paths-filter@v3
        with:
          filters: |
            # App pipeline should only run if changes are made to the src/ or charts/ directories, or both workflow files.
            # Infra pipeline should only run if changes are made to the infrastructure/ directory, or both workflow files.
            # This ensures that the CI/CD pipeline is efficient and only runs relevant jobs
            src:
              - 'src/**'
              - 'charts/**'
              - '.github/workflows/**'
            infra:
              - 'infrastructure/**'
              - '.github/workflows/**'
  
  # =========================================================================================
  # JOB 1: PROVISION BASE INFRA, EKS CLUSTER, ADD-ONS AND ARGOCD (RUNS ONLY IF INFRA CHANGES)
  # =========================================================================================
  provision-base-infra:
    name: Deploy Base Infrastructure
    runs-on: ubuntu-latest
    needs: detect-changes  # Ensure that the path-filtering completes successfully before running this job.
    # If the path filter detects changes in the infrastructure/ directory, or both workflow files, this job will run. Otherwise, it will be skipped.
    if: ${{ needs.detect-changes.outputs.infra == 'true' }}
    
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Debug GitHub OIDC JWT Claims
        run: |
          # Fetch raw JWT token from GitHub's runner service
          RESPONSE=$(curl -s -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=sts.amazonaws.com")
          JWT=$(echo $RESPONSE | jq -r '.value')
          
          # Decode and print payload claims
          echo "=== ACTUAL GITHUB OIDC CLAIMS RECEIVED BY AWS ==="
          echo "$JWT" | cut -d. -f2 | base64 -d 2>/dev/null | jq '{aud, sub, repository, repository_owner, ref}'

      - name: Configure AWS Credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::${{ secrets.AWS_ACCOUNT_ID }}:role/restaurant-api-${{ env.ENVIRONMENT }}-github-actions-role
          aws-region: ${{ env.AWS_REGION }}

      - name: Pre-Deploy Checkov Scan
        uses: bridgecrewio/checkov-action@v12.2818.0
        with:
          directory: ./infrastructure
          framework: terraform
          soft_fail: false # Fail the pipeline if any issues are found
          output_format: cli
          download_external_modules: true
          quiet: true  # Suppresses all PASSED checks so only actionable FAILED checks print to the console.
          compact: true  # Trims extra guide/file metadata lines per finding to keep logs brief and scannable. 

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.7.0" 

      - name: Terraform Init
        working-directory: ./infrastructure
        run: terraform init

      - name: Terraform Apply
        working-directory: ./infrastructure
        run: terraform apply -auto-approve

      - name: Deploy Static Media to S3 Edge
        working-directory: ./infrastructure
        run: |
          echo "Fetching dynamic static asset bucket name from Terraform state..."
          STATIC_BUCKET=$(terraform output -raw s3_static_assets_bucket_name)
          
          echo "Syncing images and asset payloads directly to s3://$STATIC_BUCKET/static/..."
          aws s3 sync ../src/restaurant/static/ s3://$STATIC_BUCKET/static/ --delete

      # Checkout external GitOps repo cleanly into a subdirectory
      - name: Checkout GitOps Repository for Infra Updates
        uses: actions/checkout@v4
        with:
          repository: ${{ env.GITOPS_REPO }}
          token: ${{ secrets.GITOPS_PAT }}
          ref: main
          path: gitops-repo

      # CONSTRAINT 3: Update GitOps repo with Terraform outputs (ALB SG & ACM Cert) using elevated PAT permissions and -chdir to avoid path collisions
      - name: Update GitOps Repository with Infra Outputs
        run: |
          ALB_SG=$(terraform -chdir=./infrastructure output -raw alb_security_group_id)
          CERT_ARN=$(terraform -chdir=./infrastructure output -raw alb_certificate_arn)
          RDS_SECRET_ARN=$(terraform -chdir=./infrastructure output -raw rds_master_secret_arn)
          
          cd gitops-repo/values/production
          
          # Use yq to dynamically inject Terraform outputs into restaurant-api-values.yaml
          yq e -i ".ingress.albSecurityGroup = \"${ALB_SG}\"" restaurant-api-values.yaml
          yq e -i ".ingress.certificateArn = \"${CERT_ARN}\"" restaurant-api-values.yaml
          yq e -i ".secrets.rdsSecretName = \"${RDS_SECRET_ARN}\"" restaurant-api-values.yaml

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add restaurant-api-values.yaml
          
          # Use [skip ci] so this automated commit doesn't recursively trigger another pipeline
          git commit -m "chore(infra): automated update of ALB SG, ACM Cert, and RDS Secret ARN [skip ci]" || echo "No changes to commit"
          git push origin main

  # ===========================================================================
  # JOB 2: BUILD, SCAN, AND PUSH DOCKER IMAGE TO ECR (RUNS ONLY IF APP CHANGES)
  # ===========================================================================
  build-scan-push:
    name: Build, Scan & Push Application
    runs-on: ubuntu-latest
    needs: [detect-changes, provision-base-infra] # Ensure that the path-filtering and base infra provisioning completes successfully before running this job.
    if: |
      always() &&
      needs.detect-changes.outputs.src == 'true' &&
      (needs.provision-base-infra.result == 'success' || needs.provision-base-infra.result == 'skipped')
    outputs:
      image_tag: ${{ steps.vars.outputs.tag }}
    
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      # Pre-build security checks (SAST & SCA) to ensure that the codebase is free from known vulnerabilities before packaging into a Docker image.
      - name: "Setup Python Security Runtime"
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: 'pip'

      - name: "Install Static Analysis Tools & Dependencies"
        run: |
          python -m pip install --upgrade pip
          pip install bandit
          if [ -f src/requirements.txt ]; then pip install -r src/requirements.txt; fi

      - name: "Execute Django Code SAST Inspection (Bandit)"
        run: |
          # Scans recursively, reporting medium/high severity concerns while skipping test directories
          bandit -r src/ -ll -ii -v

      - name: "Execute Dependency Supply-Chain SCA Scan (Snyk)"
        uses: snyk/actions/python@master
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        with:
          command: test
          args: --file=src/requirements.txt --severity-threshold=high -- --allow-missing # Hard fail if any high severity vulnerabilities are found, but allow the scan to run even if the requirements file is missing (e.g., for certain PRs)

      - name: Configure AWS Credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::${{ secrets.AWS_ACCOUNT_ID }}:role/restaurant-api-${{ env.ENVIRONMENT }}-github-actions-role
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set Image Tag
        id: vars
        run: |
          TAG=$(git rev-parse --short HEAD) # Use the short commit hash/SHA as the image tag for traceability
          echo "tag=$TAG" >> $GITHUB_OUTPUT # Set the output variable for downstream jobs
          echo "IMAGE_TAG=$TAG" >> $GITHUB_ENV  # Set the environment variable for this job

      - name: Build Docker Image
        working-directory: ./src
        run: |
          docker build -t ${{ env.ECR_REPOSITORY }}:$IMAGE_TAG .

      - name: Scan Image with Trivy (Container Vulnerability Gate)
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: '${{ env.ECR_REPOSITORY }}:${{ env.IMAGE_TAG }}'
          format: 'table'
          exit-code: '1' # Fails the CD pipeline if CRITICAL or HIGH vulnerabilities are found post-build
          ignore-unfixed: true
          severity: 'CRITICAL,HIGH'

      - name: Push Image to Amazon ECR
        run: |
          REGISTRY=${{ steps.login-ecr.outputs.registry }}
          docker tag ${{ env.ECR_REPOSITORY }}:$IMAGE_TAG $REGISTRY/${{ env.ECR_REPOSITORY }}:$IMAGE_TAG
          docker push $REGISTRY/${{ env.ECR_REPOSITORY }}:$IMAGE_TAG
   

  # ==============================================================================
  # JOB 3: UPDATE GITOPS REPOSITORY WITH NEW IMAGE TAG (RUNS ONLY IF APP CHANGES)
  # ==============================================================================
  update-gitops-app:
    name: Update ArgoCD GitOps State
    runs-on: ubuntu-latest
    needs: [detect-changes, build-scan-push]  # Ensure that the path-filtering and image build/push completes successfully before running this job.
    if: |
      always() &&
      needs.detect-changes.outputs.src == 'true' &&
      needs.build-scan-push.result == 'success'
    
    steps:
      # CONSTRAINT 2: Checkout target GitOps repository using elevated PAT permissions
      - name: Checkout GitOps Repository
        uses: actions/checkout@v4
        with:
          repository: ${{ env.GITOPS_REPO }}
          token: ${{ secrets.GITOPS_PAT }}
          ref: main

      - name: Update Image Tag in restaurant-api-values.yaml
        run: |
          cd values/production
          
          # Dynamically update the image tag state for ArgoCD to sync
          yq e -i ".image.tag = \"${{ needs.build-scan-push.outputs.image_tag }}\"" restaurant-api-values.yaml
          
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add restaurant-api-values.yaml
          git commit -m "feat(app): trigger ArgoCD release for image tag ${{ needs.build-scan-push.outputs.image_tag }} [skip ci]" || echo "No changes to commit"
          git push origin main