name: CD - Asgard Zero-Trust Deployment

on:
  push:
    branches: [ main ]
    paths:
      - '.github/**'
      - 'src/**'
      - 'infrastructure/**'
      - 'tests/**'

env:
  AWS_REGION: "eu-west-1" # Adjust to match your AWS region
  ENVIRONMENT: "dev"      # Adjust based on your target workspace

# CRITICAL: These permissions are strictly required for OIDC federation to work
permissions:
  id-token: write # Required for OIDC
  contents: read  # Required for checkout

jobs:
  provision-and-deploy:
    name: Infrastructure Sync & Deploy
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Debug GitHub OIDC JWT Claims
        run: |
          # Fetch raw JWT token from GitHub's runner service
          RESPONSE=$(curl -s -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=sts.amazonaws.com")
          JWT=$(echo $RESPONSE | jq -r '.value')
          
          # Decode and print payload claims
          echo "=== ACTUAL GITHUB OIDC CLAIMS RECEIVED BY AWS ==="
          echo "$JWT" | cut -d. -f2 | base64 -d 2>/dev/null | jq '{aud, sub, repository, repository_owner, ref}'

      # STEP 1: OIDC Zero-Trust Authentication
      - name: Configure AWS Credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::${{ secrets.AWS_ACCOUNT_ID }}:role/asgard-${{ env.ENVIRONMENT }}-github-actions-role
          aws-region: ${{ env.AWS_REGION }}