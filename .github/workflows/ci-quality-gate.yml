name: "CI Quality & Security Gate"

# Decoupled App and Infra pipeline that triggers when a pull request is opened against the main branch, but only if changes are made to src/, charts/, infrastructure/, or the workflow file itself.
on:
  pull_request:
    branches: [ main ]

permissions:
  contents: read  # Required for checkout
  pull-requests: read # Required by the paths-filter action to inspect PR diffs cleanly

jobs:
  # =========================================================================
  # JOB 0: THE TRAFFIC CONTROLLER (PATH FILTER INSPECTOR)
  # =========================================================================
  detect-changes:
    name: "Inspect Repository Changes"
    runs-on: ubuntu-latest
    outputs:
      src: ${{ steps.filter.outputs.src }}
      infra: ${{ steps.filter.outputs.infra }}
    steps:
        # Pull your code into the GitHub Runner
      - name: "Checkout Code Repository"
        uses: actions/checkout@v4

      - name: "Evaluate Changed File Paths"
        id: filter
        uses: dorny/paths-filter@v3
        with:
          filters: |
            # App pipeline should only run if changes are made to the src/ or charts/ directories, or the workflow file itself.
            # Infra pipeline should only run if changes are made to the infrastructure/ directory, or the workflow file itself.
            # This ensures that the CI/CD pipeline is efficient and only runs relevant jobs
            src:
              - 'src/**'
              - 'charts/**'
              - '.github/workflows/ci-quality-gate.yml'
            infra:
              - 'infrastructure/**'
              - '.github/workflows/ci-quality-gate.yml'

  # =========================================================================
  # JOB 1: APPLICATION CODE FUNCTIONAL VALIDATION (RUNS ONLY IF APP CHANGES)
  # =========================================================================
  application-validation:
    name: "Python Quality Engine (Matrix)"
    runs-on: ubuntu-latest
    needs: detect-changes  # Ensure that the path-filtering completes successfully before running this job.
    # If the path filter detects changes in the src/ or charts/ directories, or the workflow file itself, this job will run. Otherwise, it will be skipped.
    if: ${{ needs.detect-changes.outputs.src == 'true' }}
    strategy:
      fail-fast: false # Ensure failure in 3.10 doesn't cancel the 3.11 run prematurely
      matrix:
        python-version: ["3.10", "3.11"]

    steps:
      - name: "Checkout Code Repository"
        uses: actions/checkout@v4

      - name: "Setup Python Environment Studio (v${{ matrix.python-version }})"
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip' # Automated caching for requirements velocity

      - name: "Install Dependencies"
        run: |
          python -m pip install --upgrade pip
          pip install flake8 pytest pytest-django
          if [ -f src/requirements.txt ]; then pip install -r src/requirements.txt; fi

      - name: "Enforce Code Style Analysis (flake8)"
        run: |
          flake8 src/ --count --select=E9,F63,F7,F82 --show-source --statistics
          flake8 src/ --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics

      - name: "Execute Application Automated Test Suite (pytest)"
        env:
          DEBUG: "True"
          CI_MODE: "True"
          SECRET_KEY: "ci-validation-stub-encryption-key-for-testing-perimeter" # satisfies Django's startup check so tests can run, without exposing real production credentials
          # CRITICAL ENV ADDITIONS FOR DISCOVERY:
          PYTHONPATH: src
          DJANGO_SETTINGS_MODULE: config.settings
        run: |
          python -m pytest src/tests


  # =========================================================================
  # JOB 2: APPLICATION SECURITY SECTOR - SAST & SCA (RUNS ONLY IF APP CHANGES)
  # =========================================================================
  application-security:
    name: "Django SAST & SCA Guard"
    runs-on: ubuntu-latest
    needs: detect-changes  # Ensure that the path-filtering completes successfully before running this job.
    # If the path filter detects changes in the src/ or charts/ directories, or the workflow file itself, this job will run. Otherwise, it will be skipped.
    if: ${{ needs.detect-changes.outputs.src == 'true' }}

    steps:
      - name: "Checkout Code Repository"
        uses: actions/checkout@v4

      - name: "Setup Python Security Runtime"
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: 'pip'

      - name: "Install Static Analysis Tools & Dependencies"
        run: |
          python -m pip install --upgrade pip
          pip install bandit
          if [ -f src/requirements.txt ]; then pip install -r src/requirements.txt; fi

      - name: "Execute Django Code SAST Inspection (Bandit)"
        run: |
          # Scans recursively, reporting medium/high severity concerns while skipping test directories
          bandit -r src/ -ll -ii -v

      - name: "Execute Dependency Supply-Chain SCA Scan (Snyk)"
        uses: snyk/actions/python@master
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        with:
          command: test
          args: --file=src/requirements.txt --severity-threshold=high -- --allow-missing # Hard fail if any high severity vulnerabilities are found, but allow the scan to run even if the requirements file is missing (e.g., for certain PRs)


  # ==============================================================================
  # JOB 3: VALIDATE INFRASTRUCTURE AS CODE SYNTAX (RUNS ONLY IF INFRA CHANGES)
  # ==============================================================================
  infrastructure-validation:
    name: "Terraform Lint & Validate Gate"
    runs-on: ubuntu-latest
    needs: detect-changes  # Ensure that the path-filtering completes successfully before running this job.
    # If the path filter detects changes in the infrastructure/ directory, or the workflow file itself, this job will run. Otherwise, it will be skipped.
    if: ${{ needs.detect-changes.outputs.infra == 'true' }}
    
    steps:
      - name: "Checkout Code Repository"
        uses: actions/checkout@v4

      - name: "Setup HashiCorp Terraform CLI Studio"
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.7.0" # Aligns with core production standards

      - name: "Verify Canonical Formatting Enforcement (terraform fmt)"
        run: terraform fmt -check -recursive
        working-directory: ./infrastructure

      - name: "Initialize Remote State Handshake Components"
        run: terraform init -backend=false # Runs validation without needing active cloud credentials
        working-directory: ./infrastructure

      - name: "Execute Structural Logic Compilation Checks (terraform validate)"
        run: terraform validate
        working-directory: ./infrastructure


  # =========================================================================
  # JOB 4: STATIC APPLICATION SECURITY TESTING (RUNS ONLY IF INFRA CHANGES)
  # =========================================================================
  security-sast-scan:
    name: "Checkov Security Perimeter Scan"
    runs-on: ubuntu-latest
    needs: [detect-changes, infrastructure-validation] # Ensure that the path-filtering and infrastructure validation job completes successfully before running this security scan.
    # If the path filter detects changes in the infrastructure/ directory, or the workflow file itself, this job will run. Otherwise, it will be skipped.
    if: ${{ needs.detect-changes.outputs.infra == 'true' }}

    steps:
      - name: "Checkout Code Repository"
        uses: actions/checkout@v4

      - name: "Run Checkov Static Analysis Engine"
        uses: bridgecrewio/checkov-action@v12.2818.0
        with:
          directory: ./infrastructure
          framework: terraform
          soft_fail: false # Hard fail on any findings to enforce security perimeter integrity
          output_format: cli
          download_external_modules: true
          quiet: true  # Suppresses all PASSED checks so only actionable FAILED checks print to the console.
          compact: true  # Trims extra guide/file metadata lines per finding to keep logs brief and scannable.