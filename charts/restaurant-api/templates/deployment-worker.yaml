# Decoupled SQS background worker. Scales independently of the API.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Chart.Name }}-worker
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: {{ .Chart.Name }}
    app.kubernetes.io/component: worker
spec:
{{- if not .Values.autoscaling.enabled }}
  replicas: {{ .Values.replicaCount }}
{{- end }}
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ .Chart.Name }}
      app.kubernetes.io/component: worker
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ .Chart.Name }}
        app.kubernetes.io/component: worker
    spec:
      serviceAccountName: {{ .Values.serviceAccount.name }}
      # Enforces that the pod/container runs as a non-root user for security
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
      containers:
        - name: {{ .Chart.Name }}-worker
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          # Overrides Dockerfile CMD to launch the long-polling Django management command
          command: ["python", "manage.py", "process_bookings"]
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          envFrom:
            - secretRef:
                name: {{ .Chart.Name }}-app-secrets
          env:
            - name: AWS_REGION
              value: {{ .Values.env.awsRegion }}
            - name: DJANGO_SETTINGS_MODULE
              value: {{ .Values.env.djangoSettingsModule }}
            - name: USE_S3
              value: {{ .Values.env.useS3 | quote }}
            - name: AWS_STORAGE_BUCKET_NAME
              value: {{ .Values.env.s3BucketName }}
            - name: CLOUDFRONT_DOMAIN_NAME
              value: {{ .Values.env.cloudfrontDomain }}
            - name: DB_HOST
              value: {{ .Values.config.DB_HOST | quote }}
            - name: DB_NAME
              value: {{ .Values.config.DB_NAME | quote }}
            - name: DB_PORT
              value: {{ .Values.config.DB_PORT | quote }}
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 250m
              memory: 512Mi