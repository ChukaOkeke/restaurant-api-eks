# ESO fetches the RDS password and Django Secret Key from AWS Secrets Manager
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: {{ .Chart.Name }}-db-secret
  namespace: {{ .Release.Namespace }}
spec:
  refreshInterval: "1h"
  secretStoreRef:
    name: {{ .Values.secrets.storeName }}   # Name of the ClusterSecretStore
    kind: ClusterSecretStore
  target:
    name: {{ .Chart.Name }}-app-secrets # The actual K8s Secret created by ESO
    creationPolicy: Owner
  data:
    # 1. Django Secret Key from app-secrets
    - secretKey: DJANGO_SECRET
      remoteRef:
        key: {{ .Values.secrets.appSecretName }} # e.g., restaurant-api-dev-app-secrets
        property: DJANGO_SECRET

    # 2. RDS Credentials mapped from AWS RDS auto-generated secret to Django Env Vars
    - secretKey: DB_PASSWORD
      remoteRef:
        key: {{ .Values.secrets.rdsSecretName }} # e.g., rds!db-12345678-abcd...
        property: password
    - secretKey: DB_USER
      remoteRef:
        key: {{ .Values.secrets.rdsSecretName }}
        property: username
    - secretKey: DB_PORT
      remoteRef:
        key: {{ .Values.secrets.rdsSecretName }}
        property: port