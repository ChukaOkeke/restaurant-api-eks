{{- if .Values.serviceAccount.create -}}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ .Values.serviceAccount.name }}
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: {{ .Chart.Name }}
# Note: EKS Pod Identity Agent links this SA to an IAM role natively. 
# No eks.amazonaws.com/role-arn annotation is required.
{{- end }}