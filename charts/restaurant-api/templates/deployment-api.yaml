apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Chart.Name }}-api
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: {{ .Chart.Name }}
    app.kubernetes.io/component: api
spec:
{{- if not .Values.autoscaling.enabled }}
  replicas: {{ .Values.replicaCount }}
{{- end }}
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ .Chart.Name }}
      app.kubernetes.io/component: api
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ .Chart.Name }}
        app.kubernetes.io/component: api
    spec:
      serviceAccountName: {{ .Values.serviceAccount.name }}
      # Enforces that the pod/container runs as a non-root user for security
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
      # Ensures Pods are distributed across multiple Availability Zones for HA
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: topology.kubernetes.io/zone
          whenUnsatisfiable: DoNotSchedule
          labelSelector:
            matchLabels:
              app.kubernetes.io/component: api
      containers:
        - name: {{ .Chart.Name }}
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          ports:
            - name: http
              containerPort: 8000
              protocol: TCP
          envFrom:
            - secretRef:
                name: {{ .Chart.Name }}-app-secrets # Injected via ExternalSecret
          env:
            - name: AWS_REGION
              value: {{ .Values.env.awsRegion }}
            - name: DJANGO_SETTINGS_MODULE
              value: {{ .Values.env.djangoSettingsModule }}
            - name: USE_S3
              value: {{ .Values.env.useS3 | quote }}
            - name: AWS_STORAGE_BUCKET_NAME
              value: {{ .Values.env.s3BucketName }}
            - name: CLOUDFRONT_DOMAIN_NAME
              value: {{ .Values.env.cloudfrontDomain }}
            - name: DB_HOST
              value: {{ .Values.config.DB_HOST | quote }}
            - name: DB_NAME
              value: {{ .Values.config.DB_NAME | quote }}
            - name: DB_PORT
              value: {{ .Values.config.DB_PORT | quote }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          # Standard probes to ensure the container is ready to receive traffic
          livenessProbe:
            httpGet:
              path: /health/
              port: http
            initialDelaySeconds: 15
            periodSeconds: 20
          readinessProbe:
            httpGet:
              path: /health/
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10