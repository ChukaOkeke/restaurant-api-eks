{{- if .Values.ingress.enabled -}}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ .Chart.Name }}-ingress
  namespace: {{ .Release.Namespace }}
  annotations:
    # Ingress class backward compatibility
    kubernetes.io/ingress.class: {{ .Values.ingress.className | quote }}

    # AWS ALB specific annotations for IP mode (direct Pod routing)
    alb.ingress.kubernetes.io/scheme: internet-facing
    alb.ingress.kubernetes.io/target-type: ip
    alb.ingress.kubernetes.io/listen-ports: '[{"HTTPS":443}]'
    alb.ingress.kubernetes.io/certificate-arn: {{ .Values.ingress.certificateArn | quote }}
    alb.ingress.kubernetes.io/security-groups: {{ .Values.ingress.albSecurityGroup | quote }}
    alb.ingress.kubernetes.io/healthcheck-path: "/health/"

    # ExternalDNS triggers automatic Route 53 A-Alias record creation
    external-dns.alpha.kubernetes.io/hostname: {{ .Values.ingress.host | quote }} # api.asgardcuisines.link
    external-dns.alpha.kubernetes.io/alias: "true"
spec:
  ingressClassName: {{ .Values.ingress.className | quote }}
  rules:
    - host: {{ .Values.ingress.host | quote }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ .Chart.Name }}-svc
                port:
                  number: {{ .Values.service.port }}
{{- end }}